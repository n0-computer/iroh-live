[package]
name = "moq-ext-access"
version = "0.1.0"
edition = "2024"
description = "access control for moq nodes: grants, session requests, and who sees a publication"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[dependencies]
# A bounded multi-consumer channel, for the queue policy.
async-channel = "2.5.0"
moq-net = { workspace = true }
n0-error = "1"
n0-future = "0.3.2"
n0-watcher = "1"
url = "2.5.8"
