[package]
name = "moq-ext-access"
version = "0.1.0"
edition = "2024"
description = "access control for moq nodes: grants, admission policies, token verifiers, and who sees a publication"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[dependencies]
# A bounded multi-consumer channel, for the queue policy.
async-channel = "2.5.0"
data-encoding = { version = "2.11.1", optional = true }
ed25519-dalek = { version = "3", optional = true }
moq-auth = { workspace = true, optional = true }
moq-net = { workspace = true }
n0-error = "1.0.3"
n0-future = "0.3.2"
n0-watcher = "1.0.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"], optional = true }
# Capability chains in rcan's version-1 token format.
rcan = { version = "0.4.1", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
url = "2.5.8"

[features]
# Verifies JWTs with moq-auth, the tokens moq-relay reads.
jwt = ["dep:moq-auth"]
# Verifies rcan capability chains bound to the peer's ed25519 key.
rcan = [
    "dep:rcan",
    "dep:data-encoding",
    "dep:ed25519-dalek",
    "dep:postcard",
    "dep:serde",
]

[dev-dependencies]
# A runtime with paused time, for `Policy::timeout` and `decide_within`.
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "test-util"] }
