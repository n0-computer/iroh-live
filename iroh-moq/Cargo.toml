[package]
name = "iroh-moq"
version = "0.1.0"
edition = "2024"
description = "audio and video live streaming over iroh"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
data-encoding = "2.11.1"
derive_more = { version = "2.1.1", features = ["display"] }
iroh = { workspace = true }
# mDNS address lookup, so a ticket that names an endpoint id and no
# addresses still resolves on a network with no route to the internet.
iroh-mdns-peer-lookup = "0.1.2"
moq-net = { workspace = true }
# Only for `moq_tokio::transport::Session`, which adapts the async transport
# interface web-transport-iroh implements to the poll one moq-net requires.
# The adapter is ungated, so none of moq-tokio's connection stack comes along.
moq-tokio = { workspace = true, default-features = false }
n0-error = { version = "1", features = ["anyhow"] }
n0-future = "0.3.2"
# BBR3, the congestion controller every endpoint binds with.
noq-proto = { workspace = true }
# Older tickets encode a postcard `EndpointAddr`, and they still parse.
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
# `time` seeds each session driver's clock, and `macros` is for the `select!`
# that runs it. Both used to arrive only through feature unification with the
# rest of the workspace, which is not a thing a library can lean on.
tokio = { version = "1.53.1", features = ["sync", "time", "macros"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"
web-transport-iroh = { workspace = true }
# The H3 CONNECT request and response types. web-transport-iroh surfaces them in
# its API but does not re-export them, so the version has to be matched by hand.
web-transport-proto = "0.6"

[dev-dependencies]
futures-lite = "2"
iroh = { workspace = true, features = ["test-utils"] }
n0-tracing-test = "0.3.0"
tokio = { version = "1.53.1", features = ["full"] }
