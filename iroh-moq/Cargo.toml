[package]
name = "iroh-moq"
version = "0.1.0"
edition = "2024"
description = "MoQ over iroh: one route table fed by direct sessions and relays"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
derive_more = { version = "2.1.1", features = ["display", "debug"] }
iroh = { workspace = true }
moq-net = { workspace = true }
# The adapter from web-transport-iroh's async transport interface to the poll
# one moq-net requires, and the client relay links run on.
moq-tokio = { workspace = true, default-features = false, features = ["iroh", "noq", "aws-lc-rs"] }
n0-error = { version = "1", features = ["anyhow"] }
n0-future = "0.3.2"
n0-watcher = "1"
# BBR3, the congestion controller every endpoint binds with.
noq-proto = { workspace = true }
# `time` seeds each session driver's clock, `macros` is for `select!`.
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"
web-transport-iroh = { workspace = true }
# The H3 CONNECT types, which web-transport-iroh uses but does not re-export.
web-transport-proto = "0.6"

[dev-dependencies]
futures-lite = "2"
iroh = { workspace = true, features = ["test-utils"] }
n0-tracing-test = "0.3.0"
tokio = { version = "1.53.1", features = ["full"] }
