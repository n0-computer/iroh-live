[package]
name = "iroh-moq"
version = "0.1.0"
edition = "2024"
description = "audio and video live streaming over iroh"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
iroh = { workspace = true }
moq-net = { workspace = true }
n0-error = { version = "1", features = ["anyhow"] }
n0-future = "0.3.2"
tokio = { version = "1.53.1", features = ["sync"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"
web-transport-iroh = { workspace = true }
# The H3 CONNECT request and response types. web-transport-iroh surfaces them in
# its API but does not re-export them, so the version has to be matched by hand.
web-transport-proto = "0.6"

[dev-dependencies]
futures-lite = "2"
iroh = { workspace = true, features = ["test-utils"] }
n0-tracing-test = "0.3.0"
tokio = { version = "1.53.1", features = ["full"] }
