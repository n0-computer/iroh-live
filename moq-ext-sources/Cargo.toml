[package]
name = "moq-ext-sources"
version = "0.1.0"
edition = "2024"
description = "Media sources for moq-video and moq-audio: test pattern, audio file, rpicam, push senders"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
derive_more = { version = "2.1.1", features = ["display", "debug"] }
moq-audio = { workspace = true }
moq-mux = { workspace = true, optional = true }
moq-net = { workspace = true }
moq-video = { workspace = true }
# The source specifiers as strings in a config file.
serde = { version = "1.0.229", optional = true }
n0-error = "1.0.3"
n0-future = "0.3.2"
tokio = { version = "1.54.1", features = ["sync", "time", "rt"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

# Reads media files. moq-audio and moq-video have no container reader.
symphonia = { version = "0.6", default-features = false, features = ["pcm", "mp3", "wav", "isomp4", "aac"], optional = true }
# The catalog entry that opens moq-video's decoder for a file's H.264 track.
hang = { workspace = true, optional = true }

[dev-dependencies]
moq-mux = { workspace = true }
tokio = { version = "1.54.1", features = ["full"] }

[features]
default = ["pattern"]
# A generated test picture and a tone.
pattern = ["dep:moq-mux"]
# Decodes media files in real time: audio from WAV, MP3 and MP4 (AAC), and
# video from MP4 (H.264). OpenH264 decodes the video where no hardware
# decoder does.
file = ["dep:symphonia", "dep:hang", "moq-video/openh264"]
# Camera, screen and microphone capture. Off for a build that only publishes
# frames it makes itself, since the device stack needs V4L2 and ALSA on Linux.
capture = ["moq-video/capture", "moq-audio/capture"]
# Audio devices through PipeWire or PulseAudio instead of ALSA. Does nothing
# off Linux and the BSDs.
sound-server = ["moq-audio/pipewire", "moq-audio/pulseaudio"]
# Echo cancellation for the microphone. moq-audio only has the canceller
# handle on its capture config when playback is on too, since the canceller
# comes from a playback engine.
aec = ["capture", "moq-audio/playback"]
# Linux screen capture through xdg-desktop-portal, and PipeWire's camera as the
# default camera. Links libpipewire-0.3.
pipewire = ["capture", "moq-video/pipewire"]
# The Raspberry Pi camera through `rpicam-vid`, which must be on PATH. Linux
# only.
rpicam = ["dep:moq-mux", "tokio/process", "tokio/io-util"]
# Deserializes and serializes the source specifiers as the strings they parse from.
serde = ["dep:serde"]
