[package]
name = "moq-ext-sources"
version = "0.1.0"
edition = "2024"
description = "media sources for moq-video and moq-audio: test pattern, audio file, rpicam, push senders"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
derive_more = { version = "2.1.1", features = ["display", "debug"] }
moq-audio = { workspace = true }
moq-mux = { workspace = true, optional = true }
moq-net = { workspace = true }
moq-video = { workspace = true }
n0-error = "1"
n0-future = "0.3.2"
tokio = { version = "1.53.1", features = ["sync", "time", "rt"] }
tokio-util = "0.7.19"
tracing = "0.1.44"

# Reads audio files. moq-audio has no container reader.
symphonia = { version = "0.6", default-features = false, features = ["pcm", "mp3", "wav"], optional = true }
# moq-audio's sound-server backends on Linux, nothing elsewhere.
moq-ext-sound-server = { workspace = true, optional = true }

[dev-dependencies]
moq-mux = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }

[features]
default = ["pattern"]
# A generated test picture and a tone.
pattern = ["dep:moq-mux"]
# Decodes WAV and MP3 files in real time.
file = ["dep:symphonia"]
# Camera, screen and microphone capture. Off for a build that only publishes
# frames it makes itself, since the device stack needs V4L2 and ALSA on Linux.
capture = ["moq-video/capture", "moq-audio/capture"]
# Audio devices through PipeWire or PulseAudio instead of ALSA. Linux only; a
# no-op elsewhere.
sound-server = ["dep:moq-ext-sound-server"]
# Echo cancellation for the microphone.
aec = ["capture", "moq-audio/aec"]
# Linux screen capture through xdg-desktop-portal. Links libpipewire-0.3.
pipewire = ["capture", "moq-video/pipewire"]
# The Raspberry Pi camera through `rpicam-vid`, which must be on PATH. Linux
# only.
rpicam = ["dep:moq-mux", "tokio/process", "tokio/io-util"]
