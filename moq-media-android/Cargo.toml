[package]
name = "moq-media-android"
version = "0.1.0"
edition = "2024"
description = "Android integration for moq-media: camera sources, EGL HardwareBuffer rendering"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
moq-media = { workspace = true }
moq-net = { workspace = true }
moq-video = { workspace = true }
n0-error = { version = "1", features = ["anyhow"] }
n0-future = "0.3.1"
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
# The EGL and GL setup in `renderer`, which reports failures as plain messages
# rather than a typed error the caller could act on.
anyhow = "1"
glow = "0.16"
khronos-egl = { version = "6", features = ["dynamic"] }
libc = "0.2"

[lints]
workspace = true
