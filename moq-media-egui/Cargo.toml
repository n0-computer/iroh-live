[package]
name = "moq-media-egui"
version = "0.1.0"
edition = "2024"
description = "egui integration for moq-media video rendering"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
egui = { workspace = true }
egui-wgpu = { workspace = true, optional = true }
epaint = { version = "0.36", optional = true }
moq-media = { workspace = true }
pollster = { version = "0.4", optional = true }
tracing = "0.1.41"

[dev-dependencies]

[features]
default = ["wgpu-render"]
# `wgpu` itself is not a direct dependency: every `wgpu` type this crate names
# comes from `moq_media::video::render::wgpu`, the exact build the renderer
# links, so a texture it hands back can never be a different `wgpu` major
# than the one this crate draws with.
wgpu-render = ["dep:egui-wgpu", "dep:epaint", "dep:pollster", "moq-media/render"]
