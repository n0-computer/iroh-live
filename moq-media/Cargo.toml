[package]
name = "moq-media"
version = "0.1.0"
edition = "2024"
description = "publish and subscribe plumbing over moq-video and moq-audio"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
bytes = "1.11.0"
derive_more = { version = "2.0.1", features = ["display", "debug", "eq", "deref"] }
hang = { workspace = true }
moq-audio = { workspace = true }
moq-mux = { workspace = true }
moq-net = { workspace = true }
moq-video = { workspace = true }
n0-error = { version = "1", features = ["anyhow"] }
n0-future = "0.3.1"
n0-watcher = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.21.0"
strum = { version = "0.28", features = ["derive"] }
throttled-tracing = "0.1.0"
tokio = { version = "1.48.0", features = ["sync", "time"] }
tokio-util = "0.7.17"
tracing = "0.1.41"

# The audio file source. moq-audio pulls symphonia only for raw AAC-LC frames
# off the wire, so it has no container reader we could use instead. No resampler
# here: the encoder is told the file's own rate and converts once.
symphonia = { version = "0.5", default-features = false, features = ["pcm", "mp3", "wav"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
tracing-subscriber = "0.3.20"

[features]
default = ["capture", "sound-server"]
# Camera, screen, and microphone capture. Off for a build that only publishes
# frames it produces itself (a file source, an Android app pushing camera
# buffers), since the device stack adds V4L2 and ALSA build dependencies on
# Linux.
capture = ["moq-video/capture", "moq-audio/capture"]
# Speaker output, for anything that plays audio rather than only publishing it.
playback = ["moq-audio/playback"]
# Reach devices through the Linux sound server rather than through its ALSA
# compatibility plugin. cpal prefers PipeWire, then PulseAudio, then ALSA, and
# each check happens at runtime, so a build with this on still runs where
# neither is present. On by default because a desktop has one of them and the
# ALSA view of the same hardware is barely usable: a card's subdevices are
# listed many times over under one description, and streams appear under the
# plugin's name instead of ours.
sound-server = ["moq-audio/pipewire", "moq-audio/pulseaudio"]
# Acoustic echo cancellation: subtracts the output mix from the microphone, so a
# handset on speakerphone stops publishing its own audio back.
aec = ["capture", "playback", "moq-audio/aec"]
# Linux screen capture through xdg-desktop-portal and PipeWire. Links
# libpipewire-0.3 at build time, so it stays opt-in.
pipewire = ["capture", "moq-video/pipewire"]
# GPU rendering of decoded frames. Pulls a graphics stack, so only a build that
# actually draws video turns it on.
render = ["moq-video/render"]
# Raspberry Pi camera capture by driving `rpicam-vid` and publishing the H.264
# it already encoded. Linux only, and it needs `rpicam-vid` on PATH at runtime.
rpicam = ["tokio/process", "tokio/io-util"]
# Generated video and audio sources, so a test can publish over a real
# transport without a camera or a microphone.
test-source = ["tokio/time"]
# Intel and AMD hardware H.264 encoding.
vaapi = ["moq-video/vaapi"]
# NVIDIA hardware encode and decode. On by default upstream; off here so a
# default build stays free of the CUDA graph.
nvidia = ["moq-video/nvidia"]
