[workspace]
members = [
    "iroh-live",
    "iroh-live-cli",
    "iroh-live-relay",
    "iroh-live-node",
    "moq-transport-iroh",
    "moq-ext-access",
    "moq-ext-adaptive",
    "iroh-live-rooms",
    "moq-ext-player",
    "moq-ext-publisher",
    "moq-ext-sources",
    "moq-ext-egui",
    "demos/android/rust",
    "demos/gles-yuv",
    "demos/pi-zero",
]
resolver = "2"

[profile.release]
debug = true

[profile.release-dist]
inherits = "release"
debug = false
strip = true
lto = "thin"

[workspace.dependencies]
# External
iroh = { version = "1.4.1", default-features = false, features = ["metrics", "portmapper", "fast-apple-datapath", "tls-aws-lc-rs"] }
iroh-gossip = "0.101.0"
noq-proto = { version = "1.4", default-features = false }
iroh-tickets = "1.0.0"
iroh-smol-kv = { version = "0.4.0", default-features = false }
hang = { git = "https://github.com/moq-dev/moq", rev = "6aa4f9c1c" }
moq-net = { git = "https://github.com/moq-dev/moq", rev = "6aa4f9c1c", features = ["async"] }
moq-mux = { git = "https://github.com/moq-dev/moq", rev = "6aa4f9c1c" }
moq-json = { git = "https://github.com/moq-dev/moq", rev = "6aa4f9c1c", features = ["async"] }
# `aac` stays on: a broadcast that reached us through an RTMP or HLS gateway
# carries AAC, and dropping its audio track is a silent failure.
moq-audio = { git = "https://github.com/moq-dev/moq", rev = "6aa4f9c1c", default-features = false, features = ["aac"] }
moq-video = { git = "https://github.com/moq-dev/moq", rev = "6aa4f9c1c", default-features = false }
moq-auth = { git = "https://github.com/moq-dev/moq", rev = "6aa4f9c1c", default-features = false }
moq-relay = { git = "https://github.com/moq-dev/moq", rev = "6aa4f9c1c", default-features = false }
moq-tokio = { git = "https://github.com/moq-dev/moq", rev = "6aa4f9c1c", default-features = false }
# moq-net's poll primitives (`Waiter`, `Bridge`, `wait`), no longer re-exported.
kio = { git = "https://github.com/moq-dev/moq", rev = "6aa4f9c1c" }

# UI. egui-wgpu pins the wgpu major it links, and `moq_video::render` hands back
# a `wgpu::Texture` from its own build of wgpu 30. A texture from a different
# wgpu major is a different type, so egui and moq-video have to move together.
eframe = { version = "0.37.0", default-features = false }
egui = "0.37.0"
egui-wgpu = "0.37.0"

# In-repo crates
iroh-live = { path = "iroh-live", default-features = false }
iroh-live-node = { path = "iroh-live-node" }
moq-transport-iroh = { path = "moq-transport-iroh" }
moq-ext-access = { path = "moq-ext-access" }
moq-ext-adaptive = { path = "moq-ext-adaptive" }
iroh-live-rooms = { path = "iroh-live-rooms" }
moq-ext-player = { path = "moq-ext-player", default-features = false }
moq-ext-publisher = { path = "moq-ext-publisher", default-features = false }
moq-ext-sources = { path = "moq-ext-sources", default-features = false }
moq-ext-egui = { path = "moq-ext-egui" }

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(docsrs)"] }
elided_lifetimes_in_paths = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
or_fun_call = "warn"
use_self = "warn"
unused_async = "warn"
absolute_paths = "allow"
manual_let_else = "warn"
allow_attributes_without_reason = "warn"
mod_module_files = "deny"

# NOT FOR MERGE, pending upstream moq `Server::with_allocator`. moq from the
# `iroh-live-rate-control` branch of the Frando/moq fork, one commit on
# moq-dev/moq 6aa4f9c1c that adds moq-net's `Server::with_allocator`. Rate
# control needs it so a node's accepted sessions share its allocator, as its
# dialed ones do through `Client::with_allocator`.
# TODO(upstream): file `Server::with_allocator` to moq-dev/moq, then drop this patch.
[patch."https://github.com/moq-dev/moq"]
# Every crate of the moq source is patched, so the tree holds one copy of each.
hang = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
kio = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
kio-macros = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-audio = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-auth = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-congestion = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-crypto = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-json = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-loc = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-msf = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-mux = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-net = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-nvenc = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-pattern = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-quic = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-relay = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-sock = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-stats = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-tokio = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-v4l = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-vaapi = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
moq-video = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
qmux = { git = "https://github.com/Frando/moq", branch = "iroh-live-rate-control" }
