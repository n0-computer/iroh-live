[workspace]
members = [
    "iroh-live",
    "iroh-live-cli",
    "iroh-live-relay",
    "iroh-moq",
    "iroh-rooms",
    "moq-media",
    "moq-media-android",
    "moq-media-egui",
    "demos/android/rust",
    "demos/pi-zero",
    "demos/pi-zero-minimal",
]
resolver = "2"

[profile.release]
debug = true

[profile.release-dist]
inherits = "release"
debug = false
strip = true
lto = "thin"

[workspace.dependencies]
# External
iroh = { version = "1.1.0", default-features = false, features = ["metrics", "portmapper", "fast-apple-datapath", "tls-aws-lc-rs"] }
iroh-gossip = "0.101.0"
iroh-tickets = "1.0.0"
iroh-smol-kv = { version = "0.4.0", default-features = false }
hang = "0.20.7"
moq-net = "0.2.15"
moq-mux = "0.9.10"
# `aac` stays on: a broadcast that reached us through an RTMP or HLS gateway
# carries AAC, and dropping its audio track is a silent failure.
moq-audio = { version = "0.0.20", default-features = false, features = ["aac"] }
moq-video = { version = "0.0.20", default-features = false }
moq-relay = { version = "0.14.13", default-features = false }
moq-native = { version = "0.19.14", default-features = false }
web-transport-iroh = "0.7.0"

# UI. egui pins the wgpu major it links, and `moq_video::render` hands back a
# `wgpu::Texture` from its own build of wgpu 30. A texture from a different wgpu
# major is a different type, so these two versions have to move together.
eframe = { version = "0.36.1", default-features = false }
egui = "0.36.1"
egui-wgpu = "0.36.1"
wgpu = "30"

# In-repo crates
iroh-live = { path = "iroh-live", default-features = false }
iroh-live-relay = { path = "iroh-live-relay" }
iroh-moq = { path = "iroh-moq" }
iroh-rooms = { path = "iroh-rooms" }
moq-media = { path = "moq-media", default-features = false }
moq-media-android = { path = "moq-media-android" }
moq-media-egui = { path = "moq-media-egui" }

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(docsrs)"] }
elided_lifetimes_in_paths = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
or_fun_call = "warn"
use_self = "warn"
unused_async = "warn"
absolute_paths = "allow"
manual_let_else = "warn"
allow_attributes_without_reason = "warn"
mod_module_files = "deny"


# The moq media stack, from a local checkout while the gaps we still carry are
# upstreamed (Android MediaCodec, libcamera). Every version above matches what
# `moq-dev/moq@main` publishes, so deleting this block is the whole revert once
# those land in a release.
[patch.crates-io]
hang = { path = "../moq/rs/hang" }
moq-audio = { path = "../moq/rs/moq-audio" }
moq-mux = { path = "../moq/rs/moq-mux" }
moq-native = { path = "../moq/rs/moq-native" }
moq-net = { path = "../moq/rs/moq-net" }
moq-relay = { path = "../moq/rs/moq-relay" }
moq-video = { path = "../moq/rs/moq-video" }
