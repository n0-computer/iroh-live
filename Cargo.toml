[workspace]
members = [
    "iroh-live",
    "iroh-live-cli",
    "iroh-live-relay",
    "iroh-moq",
    "iroh-rooms",
    "iroh-live-media",
    "iroh-live-media-android",
    "iroh-live-egui",
    "demos/android/rust",
    "demos/pi-zero",
]
resolver = "2"

[profile.release]
debug = true

[profile.release-dist]
inherits = "release"
debug = false
strip = true
lto = "thin"

[workspace.dependencies]
# External
iroh = { version = "1.2.0", default-features = false, features = ["metrics", "portmapper", "fast-apple-datapath", "tls-aws-lc-rs"] }
iroh-gossip = "0.101.0"
noq-proto = { version = "1", default-features = false }
iroh-tickets = "1.0.0"
iroh-smol-kv = { version = "0.4.0", default-features = false }
hang = "0.21.0"
moq-net = "0.3.0"
moq-mux = "0.10.0"
# `aac` stays on: a broadcast that reached us through an RTMP or HLS gateway
# carries AAC, and dropping its audio track is a silent failure.
moq-audio = { version = "0.0.26", default-features = false, features = ["aac"] }
moq-video = { version = "0.0.26", default-features = false }
moq-relay = { version = "0.15.0", default-features = false }
moq-tokio = { version = "0.19.11", default-features = false }
web-transport-iroh = "0.7.0"

# UI. egui pins the wgpu major it links, and `moq_video::render` hands back a
# `wgpu::Texture` from its own build of wgpu 30. A texture from a different wgpu
# major is a different type, so these two versions have to move together.
eframe = { version = "0.36.2", default-features = false }
egui = "0.36.2"
egui-wgpu = "0.36.2"
wgpu = "30"

# In-repo crates
iroh-live = { path = "iroh-live", default-features = false }
iroh-live-relay = { path = "iroh-live-relay" }
iroh-moq = { path = "iroh-moq" }
iroh-rooms = { path = "iroh-rooms" }
iroh-live-media = { path = "iroh-live-media", default-features = false }
iroh-live-media-android = { path = "iroh-live-media-android" }
iroh-live-egui = { path = "iroh-live-egui" }

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(docsrs)"] }
elided_lifetimes_in_paths = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
or_fun_call = "warn"
use_self = "warn"
unused_async = "warn"
absolute_paths = "allow"
manual_let_else = "warn"
allow_attributes_without_reason = "warn"
mod_module_files = "deny"

# The moq media crates from `Frando/moq@iroh-live-5`: the exact commit the
# released versions were cut from (`moq-video-v0.0.26`, `moq-net-v0.3.0` and
# their siblings) plus one fix. moq-video 0.0.26 does not compile for Windows
# with the `capture` feature: the Media Foundation backend logs an
# `Option<Rate>` as a tracing field, which it is not. Every crate of the moq
# workspace that the graph uses is patched, so no crate ever meets a git copy
# of one dependency and a crates.io copy of another (`kio` is the one that
# bites: moq-net and moq-json both pass its types around). moq-relay and
# moq-tokio stay on crates.io, since their releases were cut from a later
# commit, and pick up the patched crates underneath them.
# Delete this block once a moq-video release carries the fix.
[patch.crates-io]
hang = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
kio = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-audio = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-auth = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-binary = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-flate = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-json = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-loc = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-msf = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-mux = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-net = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-nvenc = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-pattern = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-sock = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-stats = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-v4l = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
moq-video = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
