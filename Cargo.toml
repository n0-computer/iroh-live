[workspace]
members = [
    "iroh-live",
    "iroh-live-cli",
    "iroh-live-relay",
    "iroh-moq",
    "iroh-rooms",
    "moq-media",
    "moq-media-android",
    "moq-media-egui",
    "demos/android/rust",
    "demos/pi-zero",
]
resolver = "2"

[profile.release]
debug = true

[profile.release-dist]
inherits = "release"
debug = false
strip = true
lto = "thin"

[workspace.dependencies]
# External
iroh = { version = "1.2.0", default-features = false, features = ["metrics", "portmapper", "fast-apple-datapath", "tls-aws-lc-rs"] }
iroh-gossip = "0.101.0"
noq-proto = { version = "1", default-features = false }
iroh-tickets = "1.0.0"
iroh-smol-kv = { version = "0.4.0", default-features = false }
hang = "0.20.13"
moq-net = "0.2.22"
moq-mux = "0.9.16"
# `aac` stays on: a broadcast that reached us through an RTMP or HLS gateway
# carries AAC, and dropping its audio track is a silent failure.
moq-audio = { version = "0.0.25", default-features = false, features = ["aac"] }
moq-video = { version = "0.0.25", default-features = false }
moq-relay = { version = "0.14.18", default-features = false }
moq-tokio = { version = "0.19.11", default-features = false }
web-transport-iroh = "0.7.0"

# UI. egui pins the wgpu major it links, and `moq_video::render` hands back a
# `wgpu::Texture` from its own build of wgpu 30. A texture from a different wgpu
# major is a different type, so these two versions have to move together.
eframe = { version = "0.36.2", default-features = false }
egui = "0.36.2"
egui-wgpu = "0.36.2"
wgpu = "30"

# In-repo crates
iroh-live = { path = "iroh-live", default-features = false }
iroh-live-relay = { path = "iroh-live-relay" }
iroh-moq = { path = "iroh-moq" }
iroh-rooms = { path = "iroh-rooms" }
moq-media = { path = "moq-media", default-features = false }
moq-media-android = { path = "moq-media-android" }
moq-media-egui = { path = "moq-media-egui" }

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(docsrs)"] }
elided_lifetimes_in_paths = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
or_fun_call = "warn"
use_self = "warn"
unused_async = "warn"
absolute_paths = "allow"
manual_let_else = "warn"
allow_attributes_without_reason = "warn"
mod_module_files = "deny"


# The moq media stack from git rather than crates.io: `Frando/moq@iroh-live-4`,
# which is `moq-dev/moq@main` plus two build fixes.
#
# Two things keep this block. `main` has merged the `dev` branch and no release
# has been cut since, so the API this workspace is written against exists only
# in git. And `main` does not build with moq-audio's and moq-video's `capture`
# feature, which is the one we publish with: moq-dev/moq#3813 renamed
# `Clock::micros` to `Clock::now` and missed the two callers behind that
# feature, which no upstream pull-request job compiles. Nor does moq-video build
# for Android, where its MediaCodec encoder still passes the bitrate as a plain
# integer after it became a bandwidth `Rate`. One commit fixes each; both are
# moq-dev/moq#3850, which also gates the two configurations in upstream CI.
#
# Everything else this block used to carry has merged: the fMP4 export rework
# (moq-dev/moq#3573, which superseded our #3358) and the borrowing surface
# converters (#3593).
#
# Two things are easy to get wrong while this lasts. The version numbers above
# match what crates.io publishes and the code does not: crates.io's moq-net
# 0.2.22 predates the `dev` merge and main's follows it, so deleting this block
# compiles against a different crate under the same name and fails in ways that
# do not point here. And `moq-tokio` is not on crates.io at all yet, so this
# block is the only place it can come from.
#
# `git log --oneline main..iroh-live-4` on `Frando/moq` is the list, and
# `Cargo.lock` pins the exact revision. Deleting this block is the whole revert
# once a release carries both fixes.
[patch.crates-io]
hang = { git = "https://github.com/Frando/moq", branch = "iroh-live-4" }
moq-audio = { git = "https://github.com/Frando/moq", branch = "iroh-live-4" }
moq-mux = { git = "https://github.com/Frando/moq", branch = "iroh-live-4" }
moq-net = { git = "https://github.com/Frando/moq", branch = "iroh-live-4" }
moq-relay = { git = "https://github.com/Frando/moq", branch = "iroh-live-4" }
moq-tokio = { git = "https://github.com/Frando/moq", branch = "iroh-live-4" }
moq-video = { git = "https://github.com/Frando/moq", branch = "iroh-live-4" }
