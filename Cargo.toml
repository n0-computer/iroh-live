[workspace]
members = [
    "iroh-live",
    "iroh-live-cli",
    "iroh-live-relay",
    "iroh-live-node",
    "moq-transport-iroh",
    "moq-ext-access",
    "moq-ext-adaptive",
    "iroh-live-rooms",
    "moq-ext-media-core",
    "moq-ext-player",
    "moq-ext-publisher",
    "moq-ext-sources",
    "moq-ext-media-android",
    "moq-ext-egui",
    "demos/android/rust",
    "demos/pi-zero",
]
resolver = "2"

[profile.release]
debug = true

[profile.release-dist]
inherits = "release"
debug = false
strip = true
lto = "thin"

[workspace.dependencies]
# External
iroh = { version = "1.2.0", default-features = false, features = ["metrics", "portmapper", "fast-apple-datapath", "tls-aws-lc-rs"] }
iroh-gossip = "0.101.0"
noq-proto = { version = "1", default-features = false }
iroh-tickets = "1.0.0"
iroh-smol-kv = { version = "0.4.0", default-features = false }
hang = { git = "https://github.com/moq-dev/moq", rev = "02e82fdcd" }
moq-net = { git = "https://github.com/moq-dev/moq", rev = "02e82fdcd" }
moq-mux = { git = "https://github.com/moq-dev/moq", rev = "02e82fdcd" }
moq-json = { git = "https://github.com/moq-dev/moq", rev = "02e82fdcd" }
# `aac` stays on: a broadcast that reached us through an RTMP or HLS gateway
# carries AAC, and dropping its audio track is a silent failure.
moq-audio = { git = "https://github.com/moq-dev/moq", rev = "02e82fdcd", default-features = false, features = ["aac"] }
moq-video = { git = "https://github.com/moq-dev/moq", rev = "02e82fdcd", default-features = false }
moq-relay = { git = "https://github.com/moq-dev/moq", rev = "02e82fdcd", default-features = false }
moq-tokio = { git = "https://github.com/moq-dev/moq", rev = "02e82fdcd", default-features = false }
moq-room = { git = "https://github.com/moq-dev/moq", rev = "02e82fdcd" }

# UI. egui-wgpu pins the wgpu major it links, and `moq_video::render` hands back
# a `wgpu::Texture` from its own build of wgpu 30. A texture from a different
# wgpu major is a different type, so egui and moq-video have to move together.
eframe = { version = "0.36.2", default-features = false }
egui = "0.36.2"
egui-wgpu = "0.36.2"

# In-repo crates
iroh-live = { path = "iroh-live", default-features = false }
iroh-live-node = { path = "iroh-live-node" }
moq-transport-iroh = { path = "moq-transport-iroh" }
moq-ext-access = { path = "moq-ext-access" }
moq-ext-adaptive = { path = "moq-ext-adaptive" }
iroh-live-rooms = { path = "iroh-live-rooms" }
moq-ext-media-core = { path = "moq-ext-media-core" }
moq-ext-player = { path = "moq-ext-player", default-features = false }
moq-ext-publisher = { path = "moq-ext-publisher", default-features = false }
moq-ext-media-android = { path = "moq-ext-media-android" }
moq-ext-sources = { path = "moq-ext-sources", default-features = false }
moq-ext-egui = { path = "moq-ext-egui" }

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(docsrs)"] }
elided_lifetimes_in_paths = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
or_fun_call = "warn"
use_self = "warn"
unused_async = "warn"
absolute_paths = "allow"
manual_let_else = "warn"
allow_attributes_without_reason = "warn"
mod_module_files = "deny"
