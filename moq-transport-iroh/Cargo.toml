[package]
name = "moq-transport-iroh"
version = "0.1.0"
edition = "2024"
description = "MoQ sessions over iroh connections: dial, accept, moq-net's poll transport and link statistics"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[dependencies]
bytes = "1"
iroh = { workspace = true }
moq-net = { workspace = true }
n0-error = "1"
# BBR3, the congestion controller every endpoint binds with.
noq-proto = { workspace = true }
# `time` drives the link sampler's interval.
tokio = { version = "1.53.1", features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.8"
