[package]
name = "iroh-live-media-android"
version = "0.1.0"
edition = "2024"
description = "Android helpers for iroh-live apps: an EGL renderer for NV12 frames and HardwareBuffers, and JNI handles"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
derive_more = { version = "2.1.1", features = ["debug"] }
glow = "0.18"
khronos-egl = { version = "6", features = ["dynamic"] }
n0-error = "1"

[lints]
workspace = true
