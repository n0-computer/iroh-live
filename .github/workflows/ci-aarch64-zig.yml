name: CI (aarch64, zigbuild)

# Docker-free aarch64 cross-compilation using cargo-zigbuild with a Debian
# Bookworm sysroot. Builds the irl CLI binary for aarch64 in release mode with
# the same feature set the release pipeline ships, so a pull request that breaks
# one of the Linux hardware backends fails here rather than after it merges.
#
# Publishing is not this workflow's job: release.yml builds the aarch64 binary
# again on a push to main and attaches it to the rolling release along with
# every other target.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  zigbuild:
    name: aarch64 zigbuild
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - name: Install cargo-zigbuild and cargo-make
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-zigbuild,cargo-make

      - name: Install dpkg-deb (for sysroot creation)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            python3

      - name: Cache sysroot
        id: cache-sysroot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cross/sysroot-aarch64
          # Bust the cache when the sysroot script or this workflow changes.
          key: sysroot-bookworm-aarch64-${{ hashFiles('cross/create-sysroot.sh') }}

      - name: Create sysroot
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        run: cargo make cross-sysroot-aarch64

      - name: Build irl CLI (release-dist)
        run: cargo make cross-build-aarch64 -- -p iroh-live-cli --profile release-dist --features nvidia,vaapi,v4l2,rpicam,pipewire,aec
      - name: Lockfile must not have moved
        # cargo make / zigbuild take no --locked; assert the lockfile instead.
        run: git diff --exit-code Cargo.lock
