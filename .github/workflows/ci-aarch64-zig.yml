name: CI (aarch64, zigbuild)

# Docker-free aarch64 cross-compilation using cargo-zigbuild with a Debian
# Bookworm sysroot. Builds the irl CLI binary for aarch64 in release mode.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  zigbuild:
    name: aarch64 zigbuild
    permissions:
      contents: write        # uploads the irl binary to the rolling release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - name: Install cargo-zigbuild and cargo-make
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-zigbuild,cargo-make

      - name: Install dpkg-deb (for sysroot creation)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            python3

      - name: Cache sysroot
        id: cache-sysroot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cross/sysroot-aarch64
          # Bust the cache when the sysroot script or this workflow changes.
          key: sysroot-bookworm-aarch64-${{ hashFiles('cross/create-sysroot.sh') }}

      - name: Create sysroot
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        run: cargo make cross-sysroot-aarch64

      - name: Build irl CLI (release-dist)
        run: cargo make cross-build-aarch64 -- -p iroh-live-cli --profile release-dist
      - name: Lockfile must not have moved
        # cargo make / zigbuild take no --locked; assert the lockfile instead.
        run: git diff --exit-code Cargo.lock

      - name: Upload irl binary to rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/aarch64-unknown-linux-gnu/release-dist/irl irl-linux-aarch64
          chmod +x irl-linux-aarch64
          gh release upload rolling-release irl-linux-aarch64 --clobber || true
