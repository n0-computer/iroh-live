# Builds the documentation site (docs-site/ over docs/) and deploys it to
# GitHub Pages. It runs only when started by hand from the Actions tab, so a
# push never deploys. Pages must be set to "GitHub Actions" as its source.
name: Docs site

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages after building
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: mdbook@0.5.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The API docs build every library crate with all features, which needs
      # the same system libraries as CI. The relay's build script needs npm,
      # which the runner image has.
      - name: Install system deps
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpipewire-0.3-dev libclang-dev \
            libegl-dev libgbm-dev libdrm-dev libfontconfig-dev \
            libva-dev nasm
      - run: docs-site/build.sh
      - run: python3 docs-site/check-links.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/build

  deploy:
    name: Deploy
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
