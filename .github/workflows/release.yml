name: Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            artifact: irl-linux-amd64
          - name: macos-aarch64
            os: macos-14
            artifact: irl-macos-aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: release-${{ matrix.name }}

      - name: Install system deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpipewire-0.3-dev libjack-jackd2-dev libspa-0.2-dev libclang-dev \
            libegl-dev libgbm-dev libdrm-dev libfontconfig-dev \
            libva-dev nasm

      - name: Install system deps (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install libtool automake

      - name: Build release binary
        run: cargo build --locked --profile release-dist -p iroh-live-cli

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: target/release-dist/irl

  publish:
    name: Publish rolling release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # stays on: this job pushes the rolling-release tag with a bare
          # `git push`
          persist-credentials: true

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets

      - name: Prepare binaries
        run: |
          mkdir -p release
          for dir in release-assets/irl-*; do
            name="$(basename "$dir")"
            cp "$dir/irl" "release/$name"
            chmod +x "release/$name"
          done

      - name: Generate checksums
        working-directory: release
        run: sha256sum irl-* > SHA256SUMS

      - name: Ensure rolling release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if it doesn't exist yet. If it does,
          # this is a no-op. We never delete — other CI jobs (aarch64
          # zigbuild) may have already uploaded assets to it.
          git tag -f rolling-release HEAD
          git push -f origin rolling-release
          gh release create rolling-release \
            --title "Development build" \
            --latest 2>/dev/null || true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload binaries + checksums, replacing any existing ones.
          for f in release/*; do
            gh release upload rolling-release "$f" --clobber
          done

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          gh release edit rolling-release \
            --title "Development build" \
            --latest \
            --prerelease=false \
            --notes "$(cat <<NOTES
          Rolling development build from \`main\` branch.

          **Commit:** $GITHUB_SHA
          **Built:** ${BUILD_DATE}

          ### Platforms
          - **irl-linux-amd64**: Ubuntu 24.04, glibc 2.39
          - **irl-macos-aarch64**: macOS 14, Apple Silicon
          - **irl-linux-aarch64**: cross-compiled via zigbuild, glibc 2.36, Raspberry Pi OS compatible
          NOTES
          )"
