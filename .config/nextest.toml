# cargo-nextest configuration
# https://nexte.st/docs/configuration/

[profile.default]
# A test that stops making progress fails instead of holding the job until the
# CI runner's own timeout, hours later. Every test here finishes in well under a
# minute, so five minutes without an exit is a hang, not a slow machine.
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
# The patchbay tests build a simulated network and assert on frame timing and on
# rendition switches driven by measured transport stats. Two of them running at
# once starve the software encoder and trip those assertions, so the group runs
# one test at a time. Note that this serialises the group against itself and
# nothing else: tests outside it still run alongside, so a machine loaded by the
# rest of the suite can still make these marginal.
serial-patchbay = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(patchbay)'
test-group = 'serial-patchbay'
# One retry: the impairment is real, so the link takes an unpredictable moment to
# settle after netem is reconfigured.
retries = 1

# Relay bridge tests occasionally time out under load.
[[profile.default.overrides]]
filter = 'binary(relay_bridge)'
retries = 1
