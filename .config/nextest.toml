# cargo-nextest configuration
# https://nexte.st/docs/configuration/

[test-groups]
# The patchbay tests build a simulated network and assert on frame timing and on
# rendition switches driven by measured transport stats. Running them next to the
# rest of the suite starves the software encoder and trips those assertions, so
# they get the machine to themselves.
serial-patchbay = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(patchbay)'
test-group = 'serial-patchbay'
# One retry: the impairment is real, so the link takes an unpredictable moment to
# settle after netem is reconfigured.
retries = 1

# Relay bridge tests occasionally time out under load.
[[profile.default.overrides]]
filter = 'binary(relay_bridge)'
retries = 1
