[package]
name = "iroh-live-relay"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "iroh-live-relay"
path = "src/main.rs"

[dependencies]
moq-relay = { workspace = true, default-features = false, features = ["noq", "iroh"] }
moq-native = { workspace = true, default-features = false, features = ["noq", "iroh", "aws-lc-rs"] }
moq-net = { workspace = true }
iroh = { workspace = true }
iroh-live = { workspace = true }
iroh-moq = { workspace = true }
web-transport-iroh = { workspace = true }
axum = { version = "0.8", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
include_dir = "0.7"
dirs = "7"
tower-http = { version = "0.7", features = ["cors"] }
http = "1"

[dev-dependencies]
# Only to write a key as hex in the identity-file test, the form older builds
# stored and `IROH_SECRET` still takes.
data-encoding = "2.11.1"
iroh = { workspace = true }
iroh-live = { workspace = true }
moq-media = { workspace = true, features = ["test-source"] }
n0-future = "0.3.2"
rand = "0.10"
serial_test = "4"
url = "2"

[lints]
workspace = true
