[package]
name = "iroh-live-relay"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "iroh-live-relay"
path = "src/main.rs"

[dependencies]
moq-relay = { workspace = true, default-features = false, features = ["noq", "iroh"] }
moq-tokio = { workspace = true, default-features = false, features = ["noq", "iroh", "aws-lc-rs"] }
moq-net = { workspace = true }
iroh = { workspace = true }
iroh-moq = { workspace = true }
# The `live/` layout: tickets, and the grant that keeps a peer to its own
# paths. `rooms` for the room layout's part of that grant.
iroh-live = { workspace = true, features = ["rooms"] }
# Watching the pull node's sessions, to close one whose last pull retired.
n0-watcher = "1"
axum = { version = "0.8", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
derive_more = { version = "2.1.1", features = ["debug"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
include_dir = "0.7"
dirs = "7"
tower-http = { version = "0.7", features = ["cors"] }

[dev-dependencies]
iroh = { workspace = true }
iroh-live-media = { workspace = true }
# Rooms whose members attach to a relay, for forging a member through one.
iroh-live-rooms = { workspace = true }
n0-future = "0.3.2"
n0-watcher = "1"
serial_test = "4"
url = "2"

[lints]
workspace = true
