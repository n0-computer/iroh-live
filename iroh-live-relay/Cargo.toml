[package]
name = "iroh-live-relay"
version = "0.1.0"
edition = "2024"
description = "A relay that serves iroh-live broadcasts to browsers and bridges them to iroh"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
readme = "README.md"

[[bin]]
name = "iroh-live-relay"
path = "src/main.rs"

[dependencies]
moq-relay = { workspace = true, default-features = false, features = ["quic", "websocket"] }
moq-tokio = { workspace = true, default-features = false, features = ["net", "quic"] }
# The grants and leases the relay answers its admissions with.
moq-auth = { workspace = true, features = ["async"] }
moq-net = { workspace = true }
# The policy types, and the JWT verifier for iroh clients' tokens.
moq-ext-access = { workspace = true, features = ["jwt"] }
iroh = { workspace = true }
iroh-live-node = { workspace = true }
# Plain MoQ over iroh for the relay's own sessions: dial, accept, ALPNs.
moq-transport-iroh = { workspace = true }
# The `live/` layout: tickets, and the grant that keeps a peer to its own
# paths. `rooms` for the room layout's part of that grant. No `media`.
iroh-live = { workspace = true, features = ["rooms"] }
# `anyhow` for the errors of moq-relay, which returns anyhow errors.
n0-error = { version = "1.0.3", features = ["anyhow"] }
n0-future = "0.3.2"
# Watching the pull node's sessions, to close one whose last pull retired.
n0-watcher = "1.0.1"
data-encoding = "2.11.1"
axum = { version = "0.8.9", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
derive_more = { version = "2.1.1", features = ["debug"] }
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1"
rustls = { version = "0.23.46", features = ["aws-lc-rs"], default-features = false }
include_dir = "0.7"
dirs = "7"
# Decodes the broadcast name in a request path. Already in the tree through `url`.
percent-encoding = "2"
url = "2"

[dev-dependencies]
# The shared test endpoint, node and wait helpers.
iroh-live-node = { workspace = true, features = ["test-util"] }
iroh = { workspace = true }
# The tests publish and play real media through the relay.
iroh-live = { workspace = true, features = ["media", "rooms"] }
# Rooms whose members attach to a relay, for forging a member through one.
iroh-live-rooms = { workspace = true }
n0-watcher = "1.0.1"
data-encoding = "2.11.1"
serial_test = "4"
url = "2"

[lints]
workspace = true
