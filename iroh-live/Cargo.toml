[package]
name = "iroh-live"
version = "0.1.0"
edition = "2024"
description = "audio and video live streaming over iroh"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.100"
data-encoding = "2.9.0"
derive_more = { version = "2.0.1", features = ["display", "debug", "eq"] }
hang = { workspace = true }
iroh = { workspace = true }
# Rooms live in `iroh-rooms`, but `Live` still mounts the gossip protocol and
# hands the instance out, since that is what a room needs from this crate.
iroh-gossip = { workspace = true }
iroh-moq = { workspace = true }
iroh-tickets = { workspace = true }
moq-net = { workspace = true }
moq-media = { workspace = true }
n0-error = { version = "1", features = ["anyhow"] }
n0-future = "0.3.1"
n0-watcher = "1"
postcard = "1.1.3"
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.48.0", features = ["sync"] }
tokio-util = "0.7.17"
tracing = "0.1.41"
bytes = "1.11.0"
throttled-tracing = "0.1.0"


[dev-dependencies]
# The `subscribe_test` example, which the browser end-to-end suite drives, and
# the `publish` example.
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
moq-media = { workspace = true, features = ["test-source"] }
n0-tracing-test = "0.3.0"
tokio = { version = "1.48.0", features = ["full"] }
tracing-subscriber = "0.3.20"

# The patchbay suite builds its simulated network out of network namespaces, so
# it only compiles where those exist. `ctor` runs the namespace setup from an
# ELF initialiser, before the test harness has spawned a thread.
[target.'cfg(target_os = "linux")'.dev-dependencies]
ctor = "0.4"
patchbay = "0.1.0"

[lints]
workspace = true

[features]
default = ["capture", "render", "sound-server"]
# Camera, screen, and microphone capture.
capture = ["moq-media/capture"]
# Speaker output.
playback = ["moq-media/playback"]
# Reach audio devices through PipeWire or PulseAudio rather than through their
# ALSA compatibility plugin.
sound-server = ["moq-media/sound-server"]
# Acoustic echo cancellation, for a call on a handset or a laptop speaker.
aec = ["moq-media/aec"]
# Linux screen capture through xdg-desktop-portal and PipeWire.
pipewire = ["moq-media/pipewire"]
# GPU rendering of decoded frames.
render = ["moq-media/render"]
# Raspberry Pi camera capture through `rpicam-vid`.
rpicam = ["moq-media/rpicam"]
# Intel and AMD hardware H.264 encoding.
vaapi = ["moq-media/vaapi"]
# NVIDIA hardware encode and decode.
nvidia = ["moq-media/nvidia"]
# The V4L2 stateful memory-to-memory H.264 encoder and decoder on ARM SoCs.
v4l2 = ["moq-media/v4l2"]

# The example opens a camera and a microphone, so it needs the devices.
[[example]]
name = "publish"
path = "examples/publish.rs"
required-features = ["capture"]
