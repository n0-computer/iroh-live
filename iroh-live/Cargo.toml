[package]
name = "iroh-live"
version = "0.1.0"
edition = "2024"
description = "Audio and video live streaming over iroh"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
data-encoding = "2.11.1"
derive_more = { version = "2.1.1", features = ["debug"] }
iroh = { workspace = true }
iroh-live-node = { workspace = true }
# Re-exported as `iroh_live::rooms` behind the `rooms` feature. The rest of
# the crate knows nothing about rooms.
iroh-live-rooms = { workspace = true, optional = true }
moq-net = { workspace = true }
# Re-exported as `iroh_live::json`: typed JSON tracks, the latest-value
# snapshot track among them.
moq-json = { workspace = true }
moq-ext-player = { workspace = true, optional = true }
moq-ext-publisher = { workspace = true, optional = true }
moq-ext-sources = { workspace = true, optional = true }
moq-audio = { workspace = true, optional = true }
moq-video = { workspace = true, optional = true }
# Re-exported as `iroh_live::media::wgpu` behind `render`: the same crate
# moq-video renders with, so an application does not pin a matching version.
wgpu = { workspace = true, optional = true }
n0-error = "1.0.3"
n0-future = "0.3.2"
n0-watcher = "1.0.1"
# The calls service runs one task.
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
# The shared test endpoint, node and wait helpers.
iroh-live-node = { workspace = true, features = ["test-util"] }
# The source-switch helpers that the in-process switch tests use too.
moq-ext-player = { workspace = true, features = ["test-util"] }
# The recording program in docs/how-to/record.md.
moq-mux = { workspace = true }
# The examples.
clap = { version = "4.6.7", features = ["derive"] }
n0-tracing-test = "0.3.0"
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = "0.3.23"

# The patchbay suite builds its simulated network out of network namespaces, so
# it only compiles where those exist. `ctor` runs the namespace setup from an
# ELF initialiser, before the test harness has spawned a thread.
[target.'cfg(target_os = "linux")'.dev-dependencies]
ctor = "1.0"
patchbay = "0.7.0"

[lints]
workspace = true

[features]
default = []
# The usual app set.
full = ["media", "capture", "playback", "render", "record", "pipewire", "pulseaudio"]
# `iroh_live::media` with both sides.
media = ["player", "publisher"]
# Receive side: `RemoteBroadcast`, the player, decoders, `SubscriptionExt`.
player = ["dep:moq-ext-player", "dep:moq-ext-sources", "dep:moq-audio", "dep:moq-video"]
# Send side: `LocalBroadcast`, encoders, sources, the test pattern.
publisher = ["dep:moq-ext-publisher", "dep:moq-ext-sources", "moq-ext-sources/pattern", "dep:moq-audio", "dep:moq-video"]
# Camera, screen and microphone.
capture = ["publisher", "moq-ext-publisher/capture", "moq-ext-sources/capture"]
# `MediaFile` and `AudioSource::file`.
file = ["publisher", "moq-ext-publisher/file", "moq-ext-sources/file"]
# The Raspberry Pi camera through `rpicam-vid`.
rpicam = ["publisher", "moq-ext-publisher/rpicam", "moq-ext-sources/rpicam"]
# Speaker output.
playback = ["player", "moq-ext-player/playback"]
# GPU rendering, re-exports `media::wgpu`.
render = ["player", "moq-ext-player/render", "dep:wgpu"]
# `RemoteBroadcast::mux_source`.
record = ["player", "moq-ext-player/record"]
# Echo cancellation.
aec = ["capture", "playback", "moq-ext-player/aec", "moq-ext-publisher/aec", "moq-ext-sources/aec"]
# PipeWire audio on either side. With `publisher` it also builds device capture,
# with the portal's screen picker and PipeWire's camera.
pipewire = ["moq-ext-player?/pipewire", "moq-ext-publisher?/pipewire"]
# PulseAudio audio on either side.
pulseaudio = ["moq-ext-player?/pulseaudio", "moq-ext-publisher?/pulseaudio"]
# Hardware codecs: decode with `player`, encode with `publisher`.
vaapi = ["moq-ext-player?/vaapi", "moq-ext-publisher?/vaapi"]
nvidia = ["moq-ext-player?/nvidia", "moq-ext-publisher?/nvidia"]
v4l2 = ["moq-ext-player?/v4l2", "moq-ext-publisher?/v4l2"]
# Token verifiers in `node::policy`.
jwt = ["iroh-live-node/jwt"]
rcan = ["iroh-live-node/rcan"]
# qlog traces of every connection, into `QLOGDIR` if set.
qlog = ["iroh-live-node/qlog"]
# `iroh_live::rooms`.
rooms = ["dep:iroh-live-rooms"]

# The example opens a camera and a microphone, so it needs the devices.
[[example]]
name = "publish"
path = "examples/publish.rs"
required-features = ["capture"]

# The Raspberry Pi publisher: no flags, the camera's own hardware H.264. Gated
# on `rpicam` so a checkout without a Pi still builds every other example.
[[example]]
name = "publish-pi"
path = "examples/publish-pi.rs"
required-features = ["rpicam"]

# Publishes an MP4 file, as it is or re-encoded.
[[example]]
name = "publish-file"
path = "examples/publish-file.rs"
required-features = ["file"]

[[example]]
name = "subscribe_test"
path = "examples/subscribe_test.rs"
required-features = ["player"]
