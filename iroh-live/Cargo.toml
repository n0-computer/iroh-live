[package]
name = "iroh-live"
version = "0.1.0"
edition = "2024"
description = "Audio and video live streaming over iroh"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
data-encoding = "2.11.1"
derive_more = { version = "2.1.1", features = ["debug"] }
iroh = { workspace = true }
# mDNS address lookup, for networks without internet access.
iroh-mdns-peer-lookup = "0.1.2"
iroh-live-node = { workspace = true }
# Re-exported as `iroh_live::rooms` behind the `rooms` feature. The rest of
# the crate knows nothing about rooms.
iroh-live-rooms = { workspace = true, optional = true }
moq-net = { workspace = true }
# Re-exported as `iroh_live::json`: typed JSON tracks, the latest-value
# snapshot track among them.
moq-json = { workspace = true }
moq-ext-player = { workspace = true, optional = true }
moq-ext-publisher = { workspace = true, optional = true }
moq-ext-sources = { workspace = true, optional = true }
moq-audio = { workspace = true, optional = true }
moq-video = { workspace = true, optional = true }
n0-error = "1.0.3"
n0-future = "0.3.2"
n0-watcher = "1.0.1"
serde = "1.0.229"
# The calls service runs one task.
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
# The shared test endpoint, node and wait helpers.
iroh-live-node = { workspace = true, features = ["test-util"] }
# The source-switch helpers that the in-process switch tests use too.
moq-ext-player = { workspace = true, features = ["test-util"] }
# The examples.
clap = { version = "4.6.7", features = ["derive"] }
n0-tracing-test = "0.3.0"
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = "0.3.23"

# The patchbay suite builds its simulated network out of network namespaces, so
# it only compiles where those exist. `ctor` runs the namespace setup from an
# ELF initialiser, before the test harness has spawned a thread.
[target.'cfg(target_os = "linux")'.dev-dependencies]
ctor = "1.0"
patchbay = "0.7.0"

[lints]
workspace = true

[features]
default = []
# What an app that plays and publishes media wants: the media stack, device
# capture, GPU rendering, the sound server and recording.
full = ["media", "capture", "render", "sound-server", "record"]
# The media stack: `iroh_live::media`, `media::remote_broadcast`. Without it the
# crate is the layout, calls and endpoint setup only, as the relay uses it.
media = ["dep:moq-ext-player", "dep:moq-ext-publisher", "dep:moq-ext-sources", "dep:moq-audio", "dep:moq-video"]
# Recording a broadcast to a file.
record = ["media", "moq-ext-player/record"]
# Token verifiers in `iroh_live::node::policy`: JWTs and rcan chains.
jwt = ["iroh-live-node/jwt"]
rcan = ["iroh-live-node/rcan"]
# Re-exports `iroh-live-rooms` as `iroh_live::rooms`.
rooms = ["dep:iroh-live-rooms"]
# Camera, screen, and microphone capture.
capture = ["media", "moq-ext-publisher/capture", "moq-ext-sources/capture"]
# Decoding WAV and MP3 files into an `AudioSource`.
file = ["media", "moq-ext-sources/file"]
# Speaker output.
playback = ["media", "moq-ext-player/playback"]
# Reach audio devices through PipeWire or PulseAudio rather than through their
# ALSA compatibility plugin.
sound-server = ["media", "moq-ext-publisher/sound-server", "moq-ext-sources/sound-server"]
# Acoustic echo cancellation, for a call on a handset or a laptop speaker.
aec = ["capture", "moq-ext-player/aec", "moq-ext-publisher/aec", "moq-ext-sources/aec"]
# Linux screen capture through xdg-desktop-portal and PipeWire.
pipewire = ["media", "moq-ext-publisher/pipewire", "moq-ext-sources/pipewire"]
# GPU rendering of decoded frames.
render = ["media", "moq-ext-player/render"]
# Raspberry Pi camera capture through `rpicam-vid`.
rpicam = ["media", "moq-ext-publisher/rpicam", "moq-ext-sources/rpicam"]
# Intel and AMD hardware H.264 encoding and decoding.
vaapi = ["media", "moq-ext-player/vaapi", "moq-ext-publisher/vaapi"]
# NVIDIA hardware encode and decode.
nvidia = ["media", "moq-ext-player/nvidia", "moq-ext-publisher/nvidia"]
# The V4L2 stateful memory-to-memory H.264 encoder and decoder on ARM SoCs.
v4l2 = ["media", "moq-ext-player/v4l2", "moq-ext-publisher/v4l2"]

# The example opens a camera and a microphone, so it needs the devices.
[[example]]
name = "publish"
path = "examples/publish.rs"
required-features = ["capture"]

# The Raspberry Pi publisher: no flags, the camera's own hardware H.264. Gated
# on `rpicam` so a checkout without a Pi still builds every other example.
[[example]]
name = "publish-pi"
path = "examples/publish-pi.rs"
required-features = ["rpicam"]

[[example]]
name = "subscribe_test"
path = "examples/subscribe_test.rs"
required-features = ["media"]
