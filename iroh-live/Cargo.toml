[package]
name = "iroh-live"
version = "0.1.0"
edition = "2024"
description = "audio and video live streaming over iroh"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"

[dependencies]
data-encoding = "2.11.1"
derive_more = { version = "2.1.1", features = ["debug"] }
iroh = { workspace = true }
# mDNS address lookup, for networks without internet access.
iroh-mdns-peer-lookup = "0.1.2"
iroh-moq = { workspace = true }
# Re-exported as `iroh_live::rooms` behind the `rooms` feature; `Live` itself
# knows nothing about rooms.
iroh-live-rooms = { workspace = true, optional = true }
moq-net = { workspace = true }
iroh-live-media = { workspace = true, optional = true }
n0-error = "1"
serde = "1.0.229"
tracing = "0.1.44"

[dev-dependencies]
# The examples.
clap = { version = "4.6", features = ["derive"] }
n0-tracing-test = "0.3.0"
n0-watcher = "1"
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = "0.3.23"

# The patchbay suite builds its simulated network out of network namespaces, so
# it only compiles where those exist. `ctor` runs the namespace setup from an
# ELF initialiser, before the test harness has spawned a thread.
[target.'cfg(target_os = "linux")'.dev-dependencies]
ctor = "1.0"
patchbay = "0.7.0"

[lints]
workspace = true

[features]
default = ["media", "capture", "render", "sound-server"]
# The media stack: `iroh_live::media`, `Live::remote_broadcast`. Without it the
# crate is the `live/` layout only (tickets, grant, endpoint options), as the
# relay uses it.
media = ["dep:iroh-live-media"]
# Re-exports `iroh-live-rooms` as `iroh_live::rooms`.
rooms = ["dep:iroh-live-rooms"]
# Camera, screen, and microphone capture.
capture = ["media", "iroh-live-media/capture"]
# Speaker output.
playback = ["media", "iroh-live-media/playback"]
# Reach audio devices through PipeWire or PulseAudio rather than through their
# ALSA compatibility plugin.
sound-server = ["media", "iroh-live-media/sound-server"]
# Acoustic echo cancellation, for a call on a handset or a laptop speaker.
aec = ["media", "iroh-live-media/aec"]
# Linux screen capture through xdg-desktop-portal and PipeWire.
pipewire = ["media", "iroh-live-media/pipewire"]
# GPU rendering of decoded frames.
render = ["media", "iroh-live-media/render"]
# Raspberry Pi camera capture through `rpicam-vid`.
rpicam = ["media", "iroh-live-media/rpicam"]
# Intel and AMD hardware H.264 encoding and decoding.
vaapi = ["media", "iroh-live-media/vaapi"]
# NVIDIA hardware encode and decode.
nvidia = ["media", "iroh-live-media/nvidia"]
# The V4L2 stateful memory-to-memory H.264 encoder and decoder on ARM SoCs.
v4l2 = ["media", "iroh-live-media/v4l2"]

# The example opens a camera and a microphone, so it needs the devices.
[[example]]
name = "publish"
path = "examples/publish.rs"
required-features = ["capture"]

# The Raspberry Pi publisher: no flags, the camera's own hardware H.264. Gated
# on `rpicam` so a checkout without a Pi still builds every other example.
[[example]]
name = "publish-pi"
path = "examples/publish-pi.rs"
required-features = ["rpicam"]

[[example]]
name = "subscribe_test"
path = "examples/subscribe_test.rs"
required-features = ["media"]
