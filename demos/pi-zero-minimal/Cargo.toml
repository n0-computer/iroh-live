[package]
name = "pi-zero-minimal"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
iroh-live = { path = "../../iroh-live", default-features = false }
moq-media = { path = "../../moq-media", default-features = false, features = ["rpicam"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
