[package]
name = "pi-zero-demo"
version = "0.1.0"
edition = "2024"
description = "Raspberry Pi Zero 2 demo: publish camera stream, show ticket QR on e-paper, watch remote streams"
publish = false

[features]
default = ["windowed"]
windowed = ["dep:winit", "dep:glutin", "dep:glutin-winit", "dep:raw-window-handle"]

# Cross-platform dependencies (used in all targets for the binary entry point).
[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
n0-error = { version = "1", features = ["anyhow"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Linux-only dependencies - the demo only runs on Linux (Pi Zero / ARM64).
[target.'cfg(target_os = "linux")'.dependencies]
iroh = { workspace = true }
iroh-live = { workspace = true }
moq-media = { workspace = true, features = ["rpicam", "test-source"] }
moq-video = { workspace = true }
n0-future = "0.3.2"

# QR code generation
qrcode = "0.14"

# E-paper display
embedded-graphics = "0.8"
embedded-hal = "1.0"
linux-embedded-hal = "0.5"
gpio-cdev = "0.6"

# EGL/GLES2 rendering (watch command)
glow = "0.18"
khronos-egl = { version = "6", features = ["dynamic"] }
libc = "0.2"
# Held at 0.14 while `gbm` is: gbm 0.18, the latest, implements `PlanarBuffer`
# from drm 0.14, and `add_planar_framebuffer` on drm 0.15 wants its own. The two
# traits share a name and nothing else, so the pair has to move together.
drm = "0.14"
drm-fourcc = "2.2"
gbm = { version = "0.18", features = ["drm-support"] }

# Windowed mode (optional, default on)
winit = { version = "0.30", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[lints]
workspace = true
