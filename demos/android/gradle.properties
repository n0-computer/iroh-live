android.useAndroidX=true

# The dex merge holds every class in the app and its dependencies at once, and
# Compose plus CameraX plus zxing is enough for the 512m default to run out. It
# does not fail cleanly: the merge dies with `DexArchiveMergerException` and no
# mention of memory, leaves a heap dump in the project directory, and often
# succeeds on the retry, which makes it look like flakiness rather than a limit.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
