[package]
name = "iroh-live-android"
version = "0.1.0"
edition = "2024"
description = "JNI bridge for the iroh-live Android demo app"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
iroh = { workspace = true }
# `aec` implies `capture` for the microphone and `playback` for the speaker: a
# handset on speakerphone has to subtract its own output from the microphone
# or it publishes itself back. Video capture comes from Kotlin's CameraX.
iroh-live = { workspace = true, features = ["aec"] }
# The EGL renderer and JNI handles.
derive_more = { version = "2.1.1", features = ["debug"] }
glow = "0.18"
khronos-egl = { version = "6", features = ["dynamic"] }
# `Timestamp`, which camera frames are stamped with.
# `Frame` / `Surface` / `I420`, the vocabulary the camera and the renderer meet in.
# `mediacodec` gates `Surface::HardwareBuffer`. The workspace turns
# moq-video's default features off, so this crate asks for it. Safe here,
# because every dependency in this section is already
# `cfg(target_os = "android")`.
moq-video = { workspace = true, features = ["mediacodec"] }
# `NativeWindow`. moq-video no longer re-exports `ndk`, so this names the same
# 0.9 major its MediaCodec backend links.
ndk = { version = "0.9", default-features = false }
# Held at 0.21. jni 0.22 splits `JNIEnv` into an owned `Env` and an
# `EnvUnowned` that carries no JNI API of its own, which is a safety model
# rather than a rename: every entry point in this bridge has to be rewritten
# around it. Worth doing deliberately, on a machine that can build and run for
# a device, rather than blind.
jni = "0.21"
n0-error = "1.0.3"
n0-future = "0.3.2"
n0-watcher = "1.0.1"
ndk-context = "0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
