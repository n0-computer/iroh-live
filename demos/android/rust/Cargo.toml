[package]
name = "iroh-live-android"
version = "0.1.0"
edition = "2024"
description = "JNI bridge for the iroh-live Android demo app"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
iroh = { workspace = true }
iroh-live = { workspace = true, features = ["media"] }
# `capture` for the microphone source, `playback` for the speaker. Video capture
# comes from Kotlin's CameraX, not from a device this crate opens.
# `aec` implies `capture` and `playback`: a handset on speakerphone has to
# subtract its own output from the microphone or it publishes itself back.
iroh-live-media = { workspace = true, features = ["aec"] }
iroh-live-media-android = { workspace = true }
# `Timestamp`, which camera frames are stamped with.
moq-net = { workspace = true }
# `Frame` / `Surface` / `I420`, the vocabulary the camera and the renderer meet in.
# `mediacodec` is what gates `Surface::HardwareBuffer` and the `ndk` re-export
# below, and the workspace turns moq-video's default features off, so this crate
# has to ask for it. Safe here and not in `iroh-live-media-android`, because every
# dependency in this section is already `cfg(target_os = "android")`.
moq-video = { workspace = true, features = ["mediacodec"] }
# Held at 0.21. jni 0.22 splits `JNIEnv` into an owned `Env` and an
# `EnvUnowned` that carries no JNI API of its own, which is a safety model
# rather than a rename: every entry point in this bridge has to be rewritten
# around it. Worth doing deliberately, on a machine that can build and run for
# a device, rather than blind.
jni = "0.21"
n0-error = "1"
n0-future = "0.3.2"
# `Watcher`, for reading the player's status and the broadcast's catalog, and
# `Watchable`, for the peer a call is offered to.
n0-watcher = "1"
ndk-context = "0.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
