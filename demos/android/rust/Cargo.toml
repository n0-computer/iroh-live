[package]
name = "iroh-live-android"
version = "0.1.0"
edition = "2024"
description = "JNI bridge for the iroh-live Android demo app"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
iroh-live = { workspace = true }
# The microphone config handed to the audio publisher.
moq-audio = { workspace = true }
# `capture` for the microphone source, `playback` for the speaker. Video capture
# comes from Kotlin's Camera2, not from a device this crate opens.
# `aec` implies `capture` and `playback`: a handset on speakerphone has to
# subtract its own output from the microphone or it publishes itself back.
moq-media = { workspace = true, features = ["aec"] }
moq-media-android = { workspace = true }
# The broadcast model behind the offline demo pipelines, and `Timestamp`.
moq-net = { workspace = true }
# `Frame` / `Surface` / `I420`, the vocabulary the camera and the renderer meet in.
moq-video = { workspace = true }
jni = "0.21"
n0-error = "1"
# `ANativeWindow_fromSurface`, for handing the Android surface to EGL. The
# hardware-buffer types come from `moq_video::ndk` instead, so a version bump
# upstream is a build error here rather than two incompatible `ndk` crates.
ndk = { version = "0.9", features = ["api-level-26"] }
ndk-context = "0.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync", "macros"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[lints]
workspace = true
