[package]
name = "client-gpu-demo"
version = "0.1.0"
edition = "2024"
description = "Latency demo: a client sends video to a headless GPU node that filters it and sends it back"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["debug"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
egui = { workspace = true }
iroh = { workspace = true }
iroh-live = { workspace = true, features = ["capture", "render"] }
iroh-live-egui = { workspace = true }
moq-net = { workspace = true }
n0-future = "0.3.2"
n0-watcher = "1"
noq-proto = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true
