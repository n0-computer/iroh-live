[package]
name = "moq-ext-sound-server"
version = "0.1.0"
edition = "2024"
description = "turns on moq-audio's PipeWire and PulseAudio backends on Linux, and nothing elsewhere"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

# moq-audio's PulseAudio code does not compile off Linux, so its sound-server
# features can only be asked for under a Linux target. A crate feature cannot
# be target-specific, so this crate exists to carry the target table: a
# dependent's `sound-server` feature pulls it in, and on other platforms it
# adds nothing.
[target.'cfg(target_os = "linux")'.dependencies]
moq-audio = { workspace = true, features = ["pipewire", "pulseaudio"] }
