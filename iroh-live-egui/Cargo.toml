[package]
name = "iroh-live-egui"
version = "0.1.0"
edition = "2024"
description = "egui integration for iroh-live-media video rendering"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
derive_more = { version = "2.1.1", features = ["debug"] }
egui = { workspace = true }
egui-wgpu = { workspace = true, optional = true }
epaint = { version = "0.36", optional = true }
iroh-live-media = { workspace = true }
# Runs the task that wakes the window when a frame arrives.
n0-future = "0.3.2"
pollster = { version = "1.0", optional = true }
tracing = "0.1.44"

[dev-dependencies]

[features]
default = ["wgpu-render"]
# No direct `wgpu` dependency: all `wgpu` types come from
# `iroh_live_media::video::render::wgpu`, so they match the renderer's version.
wgpu-render = ["dep:egui-wgpu", "dep:epaint", "dep:pollster", "iroh-live-media/render"]
