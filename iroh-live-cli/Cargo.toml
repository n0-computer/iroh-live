[package]
name = "iroh-live-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for iroh-live: publish and watch live media"
publish = false

[[bin]]
name = "irl"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
bytesize = "2.7"
clap = { version = "4.6", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["debug", "display"] }
dirs = "7"
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
hang = { workspace = true }
iroh = { workspace = true }
iroh-live = { workspace = true, features = ["capture", "render", "rooms"] }
moq-net = { workspace = true }
iroh-live-egui = { workspace = true }
moq-mux = { workspace = true }
# The room chat track: `moq-room`'s JSON window, which `@moq/room` reads too.
moq-room = { git = "https://github.com/Frando/moq", branch = "iroh-live-5" }
n0-error = "1"
n0-future = "0.3.2"
n0-watcher = "1"
qr2term = "0.3"
# QR encoding for the ticket a call window shows its peer, and for the codes the
# scan tests decode. Only the encoder itself is wanted: the default features
# render to `image` and to SVG, and what we draw into is an egui texture.
qrcode = { version = "0.14", default-features = false }
# QR decoding for `irl watch --scan`. rqrr is a pure-Rust port of quirc that
# reads through a grayscale callback, so a captured frame's Y plane goes
# straight in with no pixel format conversion and no `image` dependency. The
# alternative, bardecoder, decodes an `image::DynamicImage` and would pull that
# crate in for a buffer we already hold as bytes.
rqrr = { version = "0.11", default-features = false }
# The zxing port, which reads through about twice the defocus rqrr does and
# fails on different pictures, so the scanner tries it first and falls back.
# QR only: the default feature set pulls in image formats, serde and a URI
# parser for pixels we already hold in a buffer.
rxing = { version = "0.9.2", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[features]
# Capture and rendering are not features here: `irl publish` and `irl watch`
# are most of the CLI and need both, so the dependencies ask for them directly.
# Echo cancellation is on by default: `irl call` and `irl room` play the other
# side while publishing a microphone, and without it a laptop sends the peer
# back to itself.
default = ["aec", "playback", "sound-server"]
playback = ["iroh-live/playback"]
sound-server = ["iroh-live/sound-server"]
aec = ["iroh-live/aec"]
pipewire = ["iroh-live/pipewire"]
# `--video rpicam`, which publishes the H.264 `rpicam-vid` already encoded.
rpicam = ["iroh-live/rpicam"]
vaapi = ["iroh-live/vaapi"]
nvidia = ["iroh-live/nvidia"]
# `--encoder v4l2` and the matching decoder, for an ARM SoC's M2M codec node.
v4l2 = ["iroh-live/v4l2"]

[lints]
workspace = true

