[package]
name = "iroh-live-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for iroh-live: publish and watch live media"
publish = false

[[bin]]
name = "irl"
path = "src/main.rs"

[dependencies]
bytes = "1.11.0"
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2"
dirs = "6"
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
iroh = { workspace = true }
iroh-live = { workspace = true, features = ["capture"] }
iroh-rooms = { workspace = true }
moq-net = { workspace = true }
moq-media = { workspace = true, features = ["test-source", "capture"] }
moq-media-egui = { workspace = true, optional = true }
moq-mux = { workspace = true }
n0-error = { version = "1", features = ["anyhow"] }
n0-future = "0.3.1"
qr2term = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
toml = "1"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[features]
# Capture is not a feature here: `irl devices` and `irl publish` are most of the
# CLI and neither compiles without it, so the dependencies ask for it directly.
default = ["playback", "render", "sound-server"]
playback = ["iroh-live/playback", "moq-media/playback"]
sound-server = ["iroh-live/sound-server", "moq-media/sound-server"]
aec = ["iroh-live/aec", "moq-media/aec"]
pipewire = ["iroh-live/pipewire", "moq-media/pipewire"]
render = ["iroh-live/render", "moq-media/render", "dep:moq-media-egui"]
vaapi = ["iroh-live/vaapi", "moq-media/vaapi"]
nvidia = ["iroh-live/nvidia", "moq-media/nvidia"]
qlog = ["iroh/qlog"]

[lints]
workspace = true

