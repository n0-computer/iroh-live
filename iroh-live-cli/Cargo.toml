[package]
name = "iroh-live-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for iroh-live: publish and watch live media"
publish = false

[[bin]]
name = "irl"
path = "src/main.rs"

[dependencies]
bytes = "1.11.0"
clap = { version = "4.5", features = ["derive"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
iroh = { workspace = true }
iroh-live = { workspace = true }
moq-net = { workspace = true }
moq-media = { workspace = true, features = ["test-source"] }
moq-media-egui = { workspace = true, optional = true }
moq-mux = { workspace = true }
n0-error = { version = "1", features = ["anyhow"] }
n0-future = "0.3.1"
qr2term = "0.3"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[features]
default = ["capture", "playback", "render"]
capture = ["iroh-live/capture", "moq-media/capture"]
playback = ["iroh-live/playback", "moq-media/playback"]
aec = ["iroh-live/aec", "moq-media/aec"]
pipewire = ["capture", "iroh-live/pipewire", "moq-media/pipewire"]
render = ["iroh-live/render", "moq-media/render", "dep:moq-media-egui"]
vaapi = ["iroh-live/vaapi", "moq-media/vaapi"]
nvidia = ["iroh-live/nvidia", "moq-media/nvidia"]
qlog = ["iroh/qlog"]

[lints]
workspace = true

