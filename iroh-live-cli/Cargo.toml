[package]
name = "iroh-live-cli"
version = "0.1.0"
edition = "2024"
description = "The irl command line tool: publish, watch, call and record over iroh-live"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/n0-computer/iroh-live"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[[bin]]
name = "irl"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
bytesize = "2.7"
clap = { version = "4.6.7", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["debug", "display"] }
dirs = "7"
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
hang = { workspace = true }
iroh = { workspace = true }
iroh-live = { workspace = true, features = ["capture", "file", "render", "rooms", "record"] }
moq-net = { workspace = true }
moq-ext-egui = { workspace = true }
moq-mux = { workspace = true }
# The room chat track: a JSON window, which `@moq/room` reads too.
moq-json = { workspace = true }
n0-error = "1.0.3"
n0-future = "0.3.2"
n0-watcher = "1.0.1"
qr2term = "0.3"
# QR encoding for the ticket a call window shows its peer, and for the codes the
# scan tests decode. Only the encoder itself is wanted: the default features
# render to `image` and to SVG, and what we draw into is an egui texture.
qrcode = { version = "0.14", default-features = false }
# QR decoding for `irl watch --scan`: the zxing port, which reads a grayscale
# buffer and through about twice the defocus quirc's port (rqrr) does. QR only:
# the default feature set pulls in image formats, serde and a URI parser for
# pixels we already hold in a buffer.
rxing = { version = "0.9.2", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3"

# `_exit`, for leaving at once without running exit handlers, see `shutdown.rs`.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[features]
# Capture and rendering are not features here: `irl publish` and `irl watch`
# are most of the CLI and need both, so the dependencies ask for them directly.
#
# Every feature is on by default, so a plain `cargo build` or `cargo install`
# gets each backend its platform can reach. Cargo features cannot depend on
# the target, so the crates below gate the code and its dependencies on
# `target_os` instead: off Linux, `pipewire`, `rpicam`, `vaapi`, `nvidia` and
# `v4l2` compile to nothing, and macOS and Windows get their capture and codec
# frameworks (AVFoundation, ScreenCaptureKit, VideoToolbox, Media Foundation,
# WGC, WASAPI) without a feature. On Linux, the build needs libpipewire and
# libclang for `sound-server` and `pipewire`; the GPU codecs bring their
# bindings and load their drivers at runtime, so a host without a GPU still
# builds and runs.
#
# Not here: moq-video's `vpx`, which needs libvpx on the build host, and
# MediaCodec, which only the Android demo uses, since `irl` has no Android
# build.
default = ["aec", "nvidia", "pipewire", "playback", "rpicam", "sound-server", "v4l2", "vaapi"]
# Echo cancellation: `irl call` and `irl room` play the other side while
# publishing a microphone, and without it a laptop sends the peer back to
# itself.
aec = ["iroh-live/aec"]
playback = ["iroh-live/playback"]
# PipeWire and PulseAudio audio devices. Linux only.
sound-server = ["iroh-live/sound-server"]
# PipeWire's shared camera as `cam` and the desktop portal's picker as
# `screen`, the only screen capture that works on Wayland. Linux only.
pipewire = ["iroh-live/pipewire"]
# `--video rpicam`, which publishes the H.264 `rpicam-vid` already encoded.
# Linux only.
rpicam = ["iroh-live/rpicam"]
# Intel and AMD hardware H.264 and H.265 through VA-API. Linux only.
vaapi = ["iroh-live/vaapi"]
# NVENC and NVDEC. Linux only.
nvidia = ["iroh-live/nvidia"]
# `--encoder v4l2` and the matching decoder, for an ARM SoC's M2M codec node.
# Linux only.
v4l2 = ["iroh-live/v4l2"]

[lints]
workspace = true

